services:
  frontend:
    image: kkoripyo-fe:latest
    build:
      context: .
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:?Set VITE_API_ORIGIN in .env}
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
